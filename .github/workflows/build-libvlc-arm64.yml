name: Build LibVLC ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-libvlc-arm64:
    runs-on: ubuntu-24.04

    container:
      image: registry.videolan.org/vlc-debian-android:20260610055743
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LibVLC ARM64
        run: |
          ./buildsystem/compile.sh -l -a arm64 -t

      - name: Upload LibVLC
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-arm64
          path: |
            libvlcjni/libvlc/jni/libs/arm64-v8a/*
            .dbg/arm64-v8a/*
